; Task 2 — blend noiseless source maps with blank noise at set SNR levels
; Used by: python blend_noise.py   (from src/)
;
; Paths: relative values are resolved against the repository root (NOT the
; working directory), so they work whether you run from src/ or the repo root.
; Output always lands in <repo>/data/datasets/<name><snr>/dataset.h5.
;
; IMPORTANT — `name` must produce folder names the trainer can discover.
; model/training/utils.py::_discover_datasets only matches
;     training_<N>dipoles[_Distance]_snr_<S>
; so the prefix has to carry the dipole count of the source dataset (N must
; match `dipole_limit` in configs/generate_data.ini). Add `_Distance` when the
; source was generated with distancing enabled. A prefix like `SNRtesting_lv_`
; blends fine but produces folders training will silently skip.
[snr_sort]
path = data/datasets/<source_dataset_folder>
name = training_1dipoles_snr_
size = 50000
blank_hdf5_path = data/blanks/blanks.h5
blank_directory =
