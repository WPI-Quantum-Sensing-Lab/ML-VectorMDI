; Task 3 — train a single curriculum model (published settings, seed 42)
; Used by: python train_model.py   (from src/)
; Every key maps to a --flag of model/training/curriculum.py;
; `key = true` toggles a flag, any other value is passed as `--key value`.
[train_model]
dataset_root = ../data/datasets
min_dipoles = 1
max_dipoles = 10
alpha = 0.6
advancement_threshold = 0.05
max_epochs_per_stage = 300
stage_samples = 20000
w_n_data = 8000
batch_size = 64
dipolenet = true
aug_prob = 0.1
physics_weight = 0.0
load_best_per_stage = true
plot_curves = true
metrics_json = baby_steps_trial_metrics.json
seed = 42
output_dir = runs/single_model
no_precompute = true
