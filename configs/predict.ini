; Task 5 — simple single prediction
; Used by: python predict.py   (from src/)
; Use `manifest` for the shipped 6-member ensemble (mean + uncertainty), or
; comment it out and set `checkpoint` for a single member instead.
[predict]
manifest = ../models/ensemble_manifest.json
; checkpoint = ../models/member_00/vector_model_baby_steps_final.pth
; Path to a dataset.h5 (or its folder); field maps are read from its 'I' array.
input = PATH_TO/dataset.h5
index = 0
device = cpu
base_channels = 32
; Optional: isotonic magnitude calibration (global table)
calibration_table = ../models/calibration/calibration_table_isotonic_global.json
