; Task 4 — train the deep ensemble (published settings: 6 members, seeds 42-47)
; Used by: python train_ensemble.py   (from src/)
; Every key maps to a --flag of model/training/ensemble.py; training keys are
; forwarded to each member's curriculum run.
[train_ensemble]
; Relative paths are resolved against the repository root (NOT the working
; directory), so this stays `data/datasets` even though you run from src/.
dataset_root = data/datasets
min_dipoles = 1
max_dipoles = 10
alpha = 0.6
advancement_threshold = 0.05
max_epochs_per_stage = 300
stage_samples = 20000
w_n_data = 8000
batch_size = 64
dipolenet = true
aug_prob = 0.1
physics_weight = 0.0
load_best_per_stage = true
plot_curves = true
metrics_json = baby_steps_trial_metrics.json
ensemble_size = 6
base_seed = 42
ensemble_output_dir = runs/ensemble
shared_cell_cache = runs/ensemble/shared_cells
