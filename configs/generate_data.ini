; Task 1 — generate synthetic multi-dipole source maps
; Used by: python generate_data.py   (from src/)
[map_generation]
scale = 100
quota = 12500
mapheight = 0.1
dataset_name = 3Dtestingdataset_SNR
; below are multipole parameters
dipole_limit = 1
 ; units of 5 microns
order = 0
 ; 0 for dipole, 1 for two dipoles summed
centering = True
 ; centering will override distancing.
distancing = False
distancing_parameter = 0.2
 ; 0.1 = 10 pixels yields 20 pixel dof
; below are testing paramters
test = False
equalize = False
remove_unequal = False
complex_sort = False
