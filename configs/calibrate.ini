; Task 3.5 — fit the isotonic magnitude calibration over evaluated datasets
; Used by: python calibrate.py   (from src/)
; `manifest` points at the ensemble manifest written by train_ensemble.py; all
; members are loaded as an ensemble and the ensemble mean is calibrated.
; A run_manifest.json from the evaluation tooling (model_path / model_type /
; dataset_directories) is also accepted.
; `datasets` lists the test datasets to survey, since the ensemble manifest
; carries no dataset list: a glob, a directory holding dataset.h5, or a parent
; of such directories. Separate several patterns with commas.
; Tables are written to src/figures/calibration_survey/.
[calibrate]
manifest = ../models/ensemble_manifest.json
datasets = PATH_TO/testing_*dipoles_Distance_snr_*
samples = 200
seed = 42
batch-size = 256
; Exclude unreliable low-R2 conditions from the calibration fit:
pool-r2-min = 0.85
