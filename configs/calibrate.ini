; Task 3.5 — fit the isotonic magnitude calibration over evaluated datasets
; Used by: python calibrate.py   (from src/)
; `manifest` is the run_manifest.json listing the datasets to survey.
; Tables are written to src/figures/calibration_survey/.
[calibrate]
manifest = PATH_TO/run_manifest.json
samples = 200
seed = 42
batch-size = 256
; Exclude unreliable low-R2 conditions from the calibration fit:
pool-r2-min = 0.85
